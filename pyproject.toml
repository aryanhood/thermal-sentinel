[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-sentinel"
version = "0.1.0"
description = "A risk-adaptive battery lab inspection rover, entirely in simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thermal Sentinel Contributors" }]
dependencies = []

[project.scripts]
thermal-sentinel = "thermal_sentinel.api:main"
thermal-sentinel-benchmark = "thermal_sentinel.benchmark:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
