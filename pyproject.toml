[project]
name = "thermal-sentinel"
version = "0.1.0"
description = "Paired, reproducible evaluation of fixed vs. risk-adaptive robot inspection patrols."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aryan Hood" }]
keywords = ["robotics", "simulation", "digital-twin", "inspection", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Repository = "https://github.com/aryanhood/thermal-sentinel"

[project.scripts]
thermal-sentinel = "thermal_sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal_sentinel"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "C4"]
ignore = [
    "PLR0911", # many returns is clearer for outcome classification
    "PLR0913",
    "PLR2004", # thresholds live in PolicyConfig; literals in tests are fine
    "RUF001",  # unicode °, −, → are intentional in user-facing strings
    "RUF003",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["thermal_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
