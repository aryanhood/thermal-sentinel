name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Unit and property tests with coverage
        run: uv run pytest --cov

      - name: Verify exported data and benchmark docs are up to date
        if: matrix.python-version == '3.13'
        run: uv run thermal-sentinel export --check

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck, lint, test, and build
        run: npm run check

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t thermal-sentinel:ci .

      - name: Start container and verify REST monitoring workflow
        run: |
          docker run -d --name thermal-sentinel-ci -p 8000:8000 thermal-sentinel:ci
          python - << 'EOF'
          import json
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as resp:
                      if resp.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("Server did not become healthy in time")

          payload = json.dumps({
              "bay_id": "B5",
              "temperature_c": 34.5,
              "sensor_id": "thermocouple-B5",
              "recorded_at": "2026-01-01T00:00:00Z",
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/readings",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=5) as resp:
              assert resp.status == 201

          with urllib.request.urlopen(req, timeout=5) as retry_resp:
              assert retry_resp.status == 200
              assert json.loads(retry_resp.read().decode())["duplicate"] is True

          batch_payload = json.dumps({
              "readings": [{
                  "bay_id": "B4",
                  "temperature_c": 28.5,
                  "sensor_id": "thermocouple-B4",
                  "recorded_at": "2026-01-01T00:00:00Z",
              }]
          }).encode()
          batch_req = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/readings/batch",
              data=batch_payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(batch_req, timeout=5) as batch_resp:
              assert batch_resp.status == 201
              batch_body = json.loads(batch_resp.read().decode())
              assert batch_body["created_count"] == 1
              assert batch_body["duplicate_count"] == 0

          with urllib.request.urlopen(batch_req, timeout=5) as batch_retry:
              assert batch_retry.status == 200
              retry_body = json.loads(batch_retry.read().decode())
              assert retry_body["created_count"] == 0
              assert retry_body["duplicate_count"] == 1

          with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/inspection/next", timeout=5) as resp:
              assert resp.status == 200
              nxt = json.loads(resp.read().decode())
              assert nxt["bay_id"] in {"B1", "B2", "B3", "B4", "B5", "B6"}

          replay_req = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/simulation/replay",
              data=json.dumps({"seed": 3, "fault_bay_id": "B5", "max_ticks": 60}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(replay_req, timeout=10) as resp:
              assert resp.status == 200

          with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/readings?bay_id=B5", timeout=5) as resp:
              assert len(json.loads(resp.read().decode())) == 1
          EOF

      - name: Clean up container
        if: always()
        run: docker rm -f thermal-sentinel-ci || true
